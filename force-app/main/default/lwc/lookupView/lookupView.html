<template>
    <div class="slds-form-element input-element" onclick={handleRedirect}>
        <label class="slds-form-element__label">{label}</label>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container slds-has-selection">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right">
                        <span class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon slds-m-left_x-small">
                            <lightning-icon icon-name={iconName}></lightning-icon>
                        </span>
                        <div class="slds-input_faux slds-combobox__input slds-combobox__input-value box-heigth">
                            <span class="slds-truncate slds-m-left_xx-small">{value}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
