<template>
    <div class="case-card slds-p-horizontal_medium slds-p-vertical_small">
        <!-- Header: case number + info, direction/priority/status, actions -->
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                <h3 class="case-title slds-truncate">
                    <lightning-formatted-url value={record.link} label={record.Name}></lightning-formatted-url>
                </h3>
                <c-tsa-net-case-info-popover record={record} class="slds-m-left_xx-small"></c-tsa-net-case-info-popover>
            </div>
            <div class="slds-no-flex slds-grid slds-grid_vertical-align-center card-badges">
                <lightning-badge label={direction} class="card-pill direction-badge"></lightning-badge>
                <lightning-badge label={priority} class={priorityStyleClass}></lightning-badge>
                <lightning-badge label={status} class={statusStyleClass}></lightning-badge>
                <c-tsa-net-case-actions
                    record={record}
                    state={state}
                    onrefresh={handleRefresh}
                    onloading={handleOnLoading}
                ></c-tsa-net-case-actions>
            </div>
        </div>

        <!-- Fields: label above value, two-column grid -->
        <div class="card-fields">
            <div class="field-block">
                <span class="field-block__label">Member</span>
                <span class="field-block__value slds-truncate" title={member}>{member}</span>
            </div>
            <div class="field-block">
                <span class="field-block__label">Request Date</span>
                <span class="field-block__value">
                    <lightning-formatted-date-time value={requestDate}></lightning-formatted-date-time>
                </span>
            </div>
            <div class="field-block">
                <span class="field-block__label">Contact</span>
                <span class="field-block__value slds-truncate" title={contact}>{contact}</span>
            </div>
            <div class="field-block">
                <span class="field-block__label">Email</span>
                <span class="field-block__value slds-truncate">
                    <lightning-formatted-email value={email}></lightning-formatted-email>
                </span>
            </div>
        </div>

        <!-- Conversation-style notes panel (temporarily hidden) -->
        <!-- <c-tsa-net-case-notes
            notes={notes}
            count={notesCount}
            record={record}
            case-subject={caseSubject}
            user={userInfo}
            is-typing={isTyping}
            onrefresh={handleRefresh}
            onloading={handleOnLoading}
            onnotesent={handleNoteSent}
        ></c-tsa-net-case-notes> -->
    </div>
</template>
