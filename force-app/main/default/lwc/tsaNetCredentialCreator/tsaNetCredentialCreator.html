<template>
    <div class="slds-container_medium slds-container_center slds-p-around_medium">
        <article class="slds-card slds-card_boundary">

            <div class="slds-card__header slds-grid slds-p-horizontal_medium slds-p-top_medium">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:api"
                            size="small"
                            alternative-text="TSANet Credentials"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-card__header-title slds-text-heading_small">New TSANet Credentials</h1>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Select the Named Credential this org uses to call the TSANet API,
                            and the Salesforce user associated with the connection.
                        </p>
                    </div>
                </header>
            </div>

            <lightning-record-edit-form
                object-api-name={objectApiName}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}
            >
                <div class="slds-card__body slds-card__body_inner slds-is-relative slds-p-vertical_medium">

                    <lightning-messages></lightning-messages>

                    <div class="slds-form slds-form_stacked">

                        <h2 class="slds-text-title_caps slds-m-bottom_x-small">Named Credential</h2>

                        <template lwc:if={isNamedCredentialListUnavailable}>
                            <lightning-input
                                label="Named Credential"
                                value={namedCredential}
                                placeholder="tsanetconnect__TSANetAPI"
                                field-level-help={namedCredentialHelp}
                                required
                                onchange={handleNamedCredentialChange}
                            ></lightning-input>
                        </template>
                        <template lwc:else>
                            <lightning-combobox
                                label="Named Credential"
                                placeholder="Select a Named Credential..."
                                options={namedCredentialOptions}
                                value={namedCredential}
                                field-level-help={namedCredentialHelp}
                                required
                                onchange={handleNamedCredentialChange}
                            ></lightning-combobox>
                        </template>
                        <p class="slds-form-element__help slds-m-top_xx-small">
                            Packaged endpoints: TSANetAPI (production), TSANetAPIDev (dev), TSANetAPIBeta (beta), TSANetAPITest (test).
                            Before saving, open the matching External Credential in Setup
                            (TSANetExternalCredential Prod / Dev / Beta / Test) and fill in the client ID
                            and client secret on the <strong>TSANetApp</strong> principal —
                            callouts fail until that is done.
                        </p>

                        <h2 class="slds-text-title_caps slds-m-bottom_x-small slds-m-top_medium">Integration User</h2>
                        <c-user-lookup
                            label="Integration User"
                            required
                            onselect={handleSelectUser}
                            onclear={handleClearUser}
                        ></c-user-lookup>
                        <p class="slds-form-element__help slds-m-top_xx-small">
                            Case Feed items created by inbound webhooks and background jobs are authored as this user.
                        </p>
                    </div>

                    <template lwc:if={isSaving}>
                        <lightning-spinner
                            variant="brand"
                            size="medium"
                            alternative-text="Saving"
                        ></lightning-spinner>
                    </template>
                </div>

                <footer class="slds-card__footer slds-text-align_right">
                    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small"
                        variant="brand"
                        type="submit"
                        label="Save"
                        disabled={isSaving}
                    ></lightning-button>
                </footer>
            </lightning-record-edit-form>
        </article>
    </div>
</template>
